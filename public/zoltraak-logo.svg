<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Cyan to Violet Arcane Gradients -->
    <linearGradient id="zlRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="zlCoreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <radialGradient id="zlGlowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#9d4edd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <filter id="zlNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Arcane Aura -->
  <circle cx="50" cy="50" r="42" fill="url(#zlGlowRadial)" />

  <!-- Outer Geometric Magic Circle -->
  <circle cx="50" cy="50" r="44" stroke="url(#zlRingGrad)" stroke-width="1.8" stroke-dasharray="7 3.5" opacity="0.85" filter="url(#zlNeon)" />
  <circle cx="50" cy="50" r="39" stroke="url(#zlRingGrad)" stroke-width="0.8" opacity="0.4" />

  <!-- Four Cardinal Focus Nodes -->
  <circle cx="50" cy="6" r="2.2" fill="#00f2fe" />
  <circle cx="94" cy="50" r="2.2" fill="#9d4edd" />
  <circle cx="50" cy="94" r="2.2" fill="#00f2fe" />
  <circle cx="6" cy="50" r="2.2" fill="#9d4edd" />

  <!-- Intersecting Octagonal Sacred Geometry -->
  <polygon points="50,15 85,50 50,85 15,50" stroke="url(#zlRingGrad)" stroke-width="1.2" fill="none" opacity="0.6" />
  <polygon points="25.2,25.2 74.8,25.2 74.8,74.8 25.2,74.8" stroke="url(#zlRingGrad)" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Inner Concentric Dial -->
  <circle cx="50" cy="50" r="24" stroke="url(#zlRingGrad)" stroke-width="1" stroke-dasharray="4 2" opacity="0.75" />

  <!-- Zoltraak Piercing Magic Beam (Vertical Core) -->
  <path d="M50 4 L54 44 L50 96 L46 44 Z" fill="url(#zlCoreGrad)" filter="url(#zlNeon)" />
  <path d="M4 50 L44 54 L96 50 L44 46 Z" fill="url(#zlCoreGrad)" opacity="0.5" filter="url(#zlNeon)" />

  <!-- Central Arcane Shard Diamond -->
  <polygon points="50,28 65,50 50,72 35,50" fill="url(#zlRingGrad)" opacity="0.3" stroke="#00f2fe" stroke-width="1.5" />
  
  <!-- High-Energy Focus Star Flare -->
  <polygon points="50,36 53.5,46.5 64,50 53.5,53.5 50,64 46.5,53.5 36,50 46.5,46.5" fill="#ffffff" filter="url(#zlNeon)" />
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
</svg>
